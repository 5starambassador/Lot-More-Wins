packages:
  - 'apps/*'
  # Own installs (each app's pnpm-workspace.yaml): the Expo apps are on a newer Expo SDK / React than the web apps.
  - '!apps/partner-app'
  - '!apps/outlet-admin-app'
  - 'packages/*'

# Expo/Metro cannot resolve packages inside pnpm's isolated store; use a hoisted
# node_modules layout (Expo's documented setup for pnpm monorepos).
nodeLinker: hoisted

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
