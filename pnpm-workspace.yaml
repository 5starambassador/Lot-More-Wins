packages:
  - 'apps/*'
  # Own install (apps/partner-app/pnpm-workspace.yaml): it is on a newer Expo SDK / React than the other apps.
  - '!apps/partner-app'
  - 'packages/*'

# Expo/Metro cannot resolve packages inside pnpm's isolated store; use a hoisted
# node_modules layout (Expo's documented setup for pnpm monorepos).
nodeLinker: hoisted

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
