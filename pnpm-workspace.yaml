packages:
  - 'apps/*'
  - 'packages/*'

# Expo/Metro cannot resolve packages inside pnpm's isolated store; use a hoisted
# node_modules layout (Expo's documented setup for pnpm monorepos).
nodeLinker: hoisted

# Use whichever pnpm the environment already has instead of downloading the exact
# packageManager version: that self-switch crashes on Vercel's build image.
managePackageManagerVersions: false
packageManagerStrict: false

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
